apiVersion: v1
kind: Secret
metadata:
  name: mirotalk-secret
  namespace: kolchurin-dev
type: Opaque
stringData:
  secretKey: ""  # Set via: kubectl create secret generic mirotalk-secret --from-literal=secretKey=YOUR_SECRET_KEY -n kolchurin-dev
  turnUsername: "mirotalk"
  turnPassword: ""  # Set via: kubectl create secret generic mirotalk-secret --from-literal=turnPassword=YOUR_TURN_PASSWORD -n kolchurin-dev