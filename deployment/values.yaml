# Helm values for kolchurin.dev
# Usage: helm install kolchurin-dev ./deployment/helm -n kolchurin-dev --create-namespace -f deployment/values.yaml

namespace: kolchurin-dev

backend:
  replicaCount: 1
  image:
    repository: kolchurin/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  env:
    PORT: "8080"
    VALKEY_ADDR: "valkey:6379"
    LOG_LEVEL: "info"
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

frontend:
  replicaCount: 1
  image:
    repository: kolchurin/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: latest
  persistence:
    enabled: false  # Set to true for production
    size: 1Gi
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: kolchurin.dev
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 3000
  tls:
    - hosts:
        - kolchurin.dev
        - www.kolchurin.dev
      secretName: kolchurin-dev-tls
