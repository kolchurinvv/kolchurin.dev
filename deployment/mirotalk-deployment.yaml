apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirotalk
  namespace: kolchurin-dev
  labels:
    app: mirotalk
    tier: webrtc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mirotalk
  template:
    metadata:
      labels:
        app: mirotalk
        tier: webrtc
    spec:
      containers:
        - name: mirotalk
          image: mirotalk/p2p:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mirotalk-secret
                  key: secretKey
            - name: APP_URL
              value: "https://meet.kolchurin.dev"
            - name: STUN_SERVER
              value: "stun:stun.l.google.com:19302"
            - name: TURN_SERVER
              value: "turn:turn.kolchurin.dev:3478"
            - name: TURN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mirotalk-secret
                  key: turnUsername
            - name: TURN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mirotalk-secret
                  key: turnPassword
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mirotalk
  namespace: kolchurin-dev
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: mirotalk