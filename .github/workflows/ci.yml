name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint frontend
        run: bun run lint

      - name: Type check frontend
        run: bun run check

      - name: Run unit and component tests with coverage
        run: bun run test:coverage

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  build-and-push:
    runs-on: ubuntu-latest
    needs: frontend-quality
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Login to Container Registry
        run: |
          echo "${{ env.GH_TOKEN }}" | podman login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} --password-stdin
      - name: Build and Push
        run: |
          # 1. Define variables based on the environment
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PREVIEW ENVIRONMENT
            TAG="preview-${{ github.head_ref }}"
            WEBHOOK_URL="${{ secrets.PREVIEW_WEBHOOK_URL }}"
            echo "Running in Preview mode: $TAG"
          else
            # PRODUCTION ENVIRONMENT
            TAG="latest"
            WEBHOOK_URL="${{ secrets.PRODUCTION_WEBHOOK_URL }}"
            echo "Running in Production mode: $TAG"
          fi

          # 2. Build the image using podman
          # Using the tag we defined above
          podman build -t ghcr.io/username/repo:$TAG .

          # 3. Push the image
          podman push ghcr.io/username/repo:$TAG

          # 4. Trigger the specific webhook for that environment
          # We pass the tag so the server knows which image to pull
          curl -X POST -H "Content-Type: application/json" \
               -d "{\"tag\": \"$TAG\", \"commit\": \"${{ github.sha }}\"}" \
               $WEBHOOK_URL

