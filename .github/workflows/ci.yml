name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        run: |
          echo "${{ env.GH_TOKEN }}" | podman login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} --password-stdin

      - name: Build frontend image
        run: |
          podman build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }} \
            -f ./deployment/Dockerfile.frontend ./frontend

      - name: Tag for latest
        run: |
          podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

      - name: Trigger Dokploy deployment
        if: github.event_name != 'pull_request'
        run: |
          curl -X POST https://app.dokploy.com/api/deploy/YIUS7MXt-JDLs2DShE-D4